<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalKart Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7faf7;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(92vw, 440px);
        border: 1px solid #d9f3e5;
        border-radius: 28px;
        background: white;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>LocalKart needs internet to fetch nearby shops and open WhatsApp. Please check your connection and try again. Shopkeeper will confirm on WhatsApp once your message is sent.</p>
    </main>
  </body>
</html>
